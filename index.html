<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 24 · Evidence of Change</title>
<style>
  :root {
    --bg: #f8f9fb; --ink: #1c2e49; --body: #303944; --muted: #6b7280; --teal: #1d898e; --gold: #e0a526;
    --hl: #ffe27a; --miss: #ffb4a8; --card: #ffffff; --line: #e0e4e8;
    --blue: #e5f0fb; --blueT: #2c5e93; --purple: #efe9f8; --purpleT: #674f9a; --yellow: #fbf0da; --yellowT: #9a6a12;
    --green: #e2f3ee; --greenT: #1d7a5f; --rose: #fbe7e7; --roseT: #a33b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  textarea, input { font: inherit; }

  /* ---------- HUB ---------- */
  #hub { position: fixed; inset: 0; background: radial-gradient(circle at 20% 10%, #24476b 0, transparent 45%), radial-gradient(circle at 85% 90%, #1d5f5f 0, transparent 45%), linear-gradient(160deg, #15233a, #0e1626); color: #f4efe6; display: flex; flex-direction: column; align-items: center; padding: 4vh 16px; overflow: auto; }
  #hub .eyebrow { letter-spacing: .3em; font-size: 13px; opacity: .7; text-align: center; }
  #hub h1 { font-size: clamp(32px, 5.4vw, 58px); margin: 6px 0 2px; letter-spacing: .02em; text-align: center; }
  #hub .tag { opacity: .85; margin-bottom: 3vh; font-size: 17px; text-align: center; }
  .fan { position: relative; width: min(1000px, 100%); height: min(42vh, 330px); flex-shrink: 0; }
  .fcard { position: absolute; bottom: 0; width: clamp(110px, 14vw, 160px); aspect-ratio: 3/4.2; border-radius: 18px; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 14px 30px rgba(0,0,0,.45); display: flex; flex-direction: column; justify-content: space-between; padding: 12px; color: #fff; transition: transform .25s; transform-origin: 50% 120%; text-align: left; overflow: hidden; }
  .fcard .em { font-size: clamp(38px, 5vw, 58px); text-align: center; margin-top: 18%; }
  .fcard .num { position: absolute; top: 9px; left: 12px; font-weight: 700; opacity: .85; }
  .fcard .done { position: absolute; top: 8px; right: 10px; font-size: 14px; }
  .fcard .nm { font-weight: 700; font-size: clamp(14px, 1.6vw, 17px); }
  .fcard .sm { font-size: 12px; opacity: .9; }
  .fcard:hover { z-index: 10 !important; }
  #hubInfo { margin-top: 4vh; width: min(760px, 100%); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 14px 18px; display: flex; gap: 16px; align-items: center; }
  #hubInfo .big { font-size: 40px; }
  #hubInfo h3 { margin: 0 0 3px; font-size: 19px; }
  #hubInfo p { margin: 0; opacity: .8; font-size: 14px; font-family: "PingFang SC", sans-serif; }
  #hubInfo button { margin-left: auto; background: var(--gold); color: #1b1b1b; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; white-space: nowrap; }
  .hubtools { margin-top: 2vh; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .hubtools button { background: rgba(255,255,255,.1); color: #f4efe6; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-family: "PingFang SC", sans-serif; }
  #hub .hint { margin-top: auto; padding-top: 2vh; font-size: 12px; opacity: .55; font-family: "PingFang SC", sans-serif; text-align: center; }

  /* ---------- DECK ---------- */
  #deck { position: fixed; inset: 0; display: none; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #eef1f5; border-bottom: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
  .bar button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 10px; }
  .bar .title { font-weight: 700; margin-left: 6px; }
  .dots { display: flex; gap: 4px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #cfd6df; }
  .dot.on { background: var(--teal); }
  .stage { flex: 1; display: flex; justify-content: center; padding: 3vh 4vw; overflow: auto; }
  .slide { width: 100%; max-width: 1100px; margin: auto 0; text-align: center; font-size: calc(var(--fs, 1) * 1rem); }
  .note { background: #fff8e8; border-top: 1px dashed #e5c98a; padding: 6px 16px; font-family: "PingFang SC", sans-serif; font-size: 14px; color: #6b5a33; min-height: 34px; }
  .note.hide { display: none; }

  .kick { color: var(--teal); font-weight: 700; letter-spacing: .14em; font-size: .9em; text-transform: uppercase; }
  .em-big { font-size: 5.5em; line-height: 1.1; }
  .h-big { font-size: 3.6em; font-weight: 700; margin: .1em 0; }
  .h-mid { font-size: 2.3em; font-weight: 700; margin: .2em 0 .5em; }
  .sub { font-size: 1.5em; color: var(--muted); }
  .quote { font-size: 1.7em; line-height: 1.5; margin: .2em auto .8em; max-width: 900px; }
  .callout { margin-top: 3vh; font-size: 1.5em; font-weight: 700; color: var(--teal); }

  .cards { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 1.4vw; text-align: left; }
  .c { border: 1px solid var(--line); border-radius: 16px; padding: 1em 1.1em; font-size: 1.3em; line-height: 1.45; color: var(--body); min-height: 7em; }
  .c b { display: block; font-size: .8em; letter-spacing: .08em; margin-bottom: .4em; }
  .c.blue { background: var(--blue); } .c.blue b { color: var(--blueT); }
  .c.purple { background: var(--purple); } .c.purple b { color: var(--purpleT); }
  .c.yellow { background: var(--yellow); } .c.yellow b { color: var(--yellowT); }
  .c.green { background: var(--green); } .c.green b { color: var(--greenT); }
  .c.rose { background: var(--rose); } .c.rose b { color: var(--roseT); }
  .c.hidden { cursor: pointer; }
  .c.hidden .body { filter: blur(6px); opacity: .5; }

  .journey { display: grid; grid-template-columns: repeat(10, 1fr); gap: .6vw; margin: 2vh 0 3vh; }
  .jstop { background: var(--blue); border: 1px solid var(--line); border-radius: 14px; padding: .6em .2em; cursor: pointer; transition: .15s; }
  .jstop .n { font-size: 2em; font-weight: 700; color: var(--blueT); }
  .jstop .l { font-size: .75em; font-weight: 700; letter-spacing: .04em; }
  .jstop.today { background: var(--green); border: 2px solid var(--greenT); }
  .jstop.today .n { color: var(--greenT); }
  .jstop.pick { background: var(--hl); transform: translateY(-6px); }

  .bigbtn { margin-top: 2vh; background: var(--teal); color: #fff; border: 0; border-radius: 12px; padding: .5em 1.1em; font-size: 1.2em; font-weight: 700; }
  .ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 1.5vh; }
  .btnrow .bigbtn { margin-top: 0; font-size: 1.05em; }
  .bigbtn.rec { background: #c0392b; }

  .passage { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 3vh 3vw; text-align: left; font-size: 1.7em; line-height: 1.9; }
  .w { border-radius: 6px; padding: 0 .05em; cursor: pointer; }
  .w.mark { background: var(--miss); }
  .w.stress { font-weight: 700; text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 3px; }
  .w.cut::after { content: " /"; color: var(--teal); font-weight: 700; }
  .modes { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 1.5vh; }
  .modes button { border: 0; background: #fff; padding: .45em 1em; font-size: 1em; }
  .modes button.on { background: var(--ink); color: #fff; }
  .timer { font-variant-numeric: tabular-nums; font-size: 1.4em; font-weight: 700; color: var(--ink); margin-left: 10px; }
  audio { vertical-align: middle; margin: 0 6px; height: 36px; }
  .tally { font-size: 1.05em; color: var(--muted); margin-top: 1vh; font-family: "PingFang SC", sans-serif; }

  table.grid { margin: 0 auto; border-collapse: separate; border-spacing: 0; font-size: 1.25em; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  table.grid th { background: var(--ink); color: #fff; padding: .55em .9em; font-weight: 700; }
  table.grid td { padding: .45em .7em; border-top: 1px solid var(--line); }
  table.grid td:first-child { text-align: left; font-weight: 700; background: var(--blue); }
  .pills { display: inline-flex; gap: 4px; }
  .pill { width: 2em; height: 2em; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-weight: 700; color: var(--body); }
  .pill.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .pill.t.on { background: var(--gold); border-color: var(--gold); color: #1b1b1b; }
  .legend { font-size: .95em; color: var(--muted); margin-top: 1.2vh; font-family: "PingFang SC", sans-serif; }

  .frames { display: grid; gap: 1.6vh; text-align: left; max-width: 980px; margin: 0 auto; }
  .frame { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: .7em 1em; }
  .frame label { display: block; font-size: 1.25em; font-weight: 700; color: var(--ink); margin-bottom: .35em; }
  .frame textarea { width: 100%; border: 1px dashed #c9d1db; border-radius: 10px; padding: .5em .7em; font-size: 1.2em; resize: vertical; min-height: 2.6em; background: #fbfcfd; color: var(--body); }
  .frame textarea:focus { outline: 2px solid var(--teal); background: #fff; }
  .choice { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: .4em; }
  .choice button { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: .3em .9em; font-size: 1.1em; }
  .choice button.on { background: var(--teal); color: #fff; border-color: var(--teal); }

  .scale { font-size: 1.5em; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 2vh 0 1vh; flex-wrap: wrap; }
  .scale .pill { width: 2.2em; height: 2.2em; }

  .rank { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1vw; text-align: left; }
  .rank .c { cursor: pointer; position: relative; min-height: 8em; transition: .15s; }
  .rank .c.on { outline: 3px solid var(--teal); transform: translateY(-4px); }
  .rank .badge { position: absolute; top: -12px; right: -8px; background: var(--teal); color: #fff; border-radius: 50%; width: 1.8em; height: 1.8em; display: flex; align-items: center; justify-content: center; font-weight: 700; }

  .mission { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2vw; text-align: left; }
  .mission .c { cursor: pointer; min-height: 6em; }
  .mission .c .min { font-size: .85em; color: var(--muted); }

  .summary { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 1em 1.3em; font-size: 1em; max-height: 56vh; overflow: auto; white-space: pre-wrap; font-family: "PingFang SC", Menlo, monospace; line-height: 1.6; }
  .finale { display: inline-block; border: 8px double var(--gold); border-radius: 36px; padding: 4vh 5vw; background: #fffaf0; }

  @media (max-width: 760px) {
    .slide { font-size: calc(var(--fs, 1) * .7rem); }
    .cards, .mission { grid-template-columns: 1fr 1fr; }
    .rank { grid-template-columns: 1fr 1fr; }
    .journey { grid-template-columns: repeat(5, 1fr); }
    .fcard { width: 92px; }
  }
</style>
</head>
<body>

<div id="hub">
  <div class="eyebrow">PHASE 2 · LESSON 24 · READY</div>
  <h1>📈 Evidence of Change</h1>
  <div class="tag">From “I think I improved” → “Here is my proof.”</div>
  <div class="fan" id="fan"></div>
  <div id="hubInfo"></div>
  <div class="hubtools">
    <button id="toSummary">📋 课堂记录汇总</button>
    <button id="resetAll">🗑 清空本设备上的记录</button>
  </div>
  <div class="hint">鼠标移到卡片上看介绍，点击进入 · 课件里 ← → 翻页，N 显示/隐藏老师提示，Esc 回到总入口 · 课上填写和打分只存在这台设备的浏览器里</div>
</div>

<div id="deck">
  <div class="bar">
    <button id="home">⌂ Lesson 24</button>
    <span class="title" id="dtitle"></span>
    <div class="dots" id="dots"></div>
    <button id="prev">‹</button><span id="count"></span><button id="next">›</button>
    <button id="fsm">A−</button><button id="fsp">A+</button>
    <button id="ntog">老师提示</button>
  </div>
  <div class="stage"><div class="slide" id="slide"></div></div>
  <div class="note" id="note"></div>
</div>

<script>
const PASSAGE = 'Starting a new school year can feel exciting and stressful at the same time. Students often have more homework, new responsibilities, and less free time. A good plan can help, but a plan only works when a student takes action. Independent learners do not wait for someone to tell them every next step. They notice what needs to be done, choose what is most important, and begin. When they make mistakes, they reflect, adjust, and try again.';

// ---------- storage (this device only) ----------
const KEY = 'lesson24_evidence_v1';
let DB = {};
try { DB = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { DB = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} };
const get = (k, d) => (k in DB ? DB[k] : d);
const put = (k, v) => { DB[k] = v; save(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ROUNDS = [
  { name: 'Check In', zh: '开场', em: '🧭', c1: '#5fa8d3', c2: '#2b6cb0', min: '0–5′',
    info: '旅程回顾、今天的任务、灵修（腓立比书 1:6）、5 句话快速 check-in。',
    slides: [
      { t: 'title', kick: 'Phase 2 · Lesson 24 · Ready', em: '📈', big: 'Evidence of Change', sub: 'From “I think I improved” → “Here is my proof.”',
        note: '开场 1 分钟。今天是第二阶段最后一课：不学新内容，用证据回答“我变了吗”。老师今天提问、记录，少讲。' },
      { t: 'journey', note: '让他点出对他最有用的一课（会变黄），说一个理由。记录在汇总里。' },
      { t: 'mission', note: '点卡片可以直接跳到那个环节。时间紧：先保朗读对比和一周计划，作品集可以缩成 1 件。' },
      { t: 'cards', kick: 'Devotion · Perseverance', title: 'A Good Work Has Begun',
        quote: '“He who began a good work in you will carry it on to completion.” — Philippians 1:6',
        items: [['blue', 'REFLECT', 'What good work has started in me during these 10 lessons?'], ['green', 'RESPOND', 'One thing that has begun: ______<br>One thing I will keep going with: ______']],
        callout: 'Not finished ≠ failed. Growth keeps going.', note: '3 分钟。连到今天的 Step 5（Adapt & Persevere）：开始了，但还没完成。' },
      { t: 'cards', kick: 'Fast Check-In', title: '5 Complete Sentences', n: 5,
        items: [['blue', 'FEEL', 'I feel ___ because ___.'], ['purple', 'NEED', 'Today I need ___.'], ['yellow', 'GRATITUDE', 'I am grateful for ___ because ___.'], ['green', 'NOTICE', 'I notice ___ about God / myself.'], ['rose', 'ACTION', 'At ___, I will ___; evidence: ___.']],
        note: '2 分钟，保持简短。这里不评估情绪，只是开场。' },
    ] },
  { name: 'Same Passage', zh: '同文冷读', em: '🎙️', c1: '#9b7fd1', c2: '#6b46c1', min: '5–13′',
    info: '第 15 课那篇文章，同样的规则：只读一遍、不纠正、录音。老师边听边点出误读的词。',
    slides: [
      { t: 'cards', kick: 'Reading Evidence · Lesson 15 → Lesson 24', title: 'Same Passage · No Practice First',
        items: [['blue', 'LESSON 15', 'You read this passage for the first time. We recorded a Cold Read and a Final Read.'], ['purple', 'TODAY', 'Read it ONE time.<br>No teacher correction.<br>Teacher records.'], ['green', 'THEN', 'We listen and compare.<br>What changed? What did not?']],
        callout: 'This is a fair test: same text, same rules.', note: '规则和第 15 课 Cold Read 一样。读完之前不要给任何提示。' },
      { t: 'passage', note: '① 点“开始录音”再让他读（浏览器会问麦克风权限）。② 他读时，点他读错 / 卡住的词（变红）。③ 读完点“停止”，下面会出现回放。录音只在这一页，刷新就没了；想保存就点“下载录音”。' },
      { t: 'score', id: 'read', title: 'Score Today’s Read', cols: ['L24 Today'], rows: ['Accuracy', 'Chunking', 'Prosody'], max: 5,
        note: '马上打分（/5），和第 15 课同一个标准。误读词数量会自动记进汇总。' },
    ] },
  { name: 'Compare', zh: '录音对比', em: '🔁', c1: '#3fb6b2', c2: '#1f7a8c', min: '13–20′',
    info: '播放第 15 课录音，填入第 15 课的分数，和今天对比；再检查他是不是读懂了（gist / 结构 / 哪句像现在的我）。',
    slides: [
      { t: 'score', id: 'cmp', title: 'Compare the Evidence · 3 Recordings', cols: ['L15 Cold', 'L15 Final', 'L24 Today'], rows: ['Accuracy', 'Chunking', 'Prosody'], max: 5, link: 'read',
        note: '先播第 15 课 Cold Read，再播今天的录音。“L24 Today”一列自动带入上一环节的分数。第 15 课录音找不到：只填当时的分数，在汇总里会注明。' },
      { t: 'frames', id: 'cmpq', title: 'What Changed?', prompts: ['Today’s first read is closer to the L15 □ cold read / □ final read, because ___.', 'What I practised that made the difference (or stopped practising): ___.'],
        note: '先让他自己说听到的变化，老师再补充。可以让他自己打字。' },
      { t: 'passage', mode: 'chunk', title: 'Reading Is Not Just Sound', note: '“Chunk” 模式：让他点每个意群结束的词，会出现 /。“Stress” 模式：点要重读的词。看他自己能不能分出意群——第 15 课是老师给的斜线。' },
      { t: 'frames', id: 'meaning', title: 'Check the Meaning', prompts: ['GIST — In ONE sentence, this passage is mainly about ___.', 'STRUCTURE — Part 1: ___ → Part 2: ___ → Part 3: ___', 'ME — A sentence that describes me NOW: ___', 'ME — A sentence that is NOT YET me: ___'],
        note: '确认他读懂了，不只是读顺。最后两题把文章和他自己连起来——这就是第二阶段的主题。' },
    ] },
  { name: 'Portfolio', zh: '作品集', em: '🗂️', c1: '#f08a5d', c2: '#d64933', min: '20–35′',
    info: '三件证据：朗读（刚做完）、广告从初稿到终稿的一处修改、AI 学习者自评。每件都说 Before / Now / Evidence。',
    slides: [
      { t: 'cards', kick: 'Portfolio · 3 Pieces of Evidence', title: 'Show the Change · Not Just the Final Product',
        items: [['blue', '1 · READING / FLUENCY', 'Today’s recording + scores<br>(we just did this)'], ['purple', '2 · WRITING', 'Advertisement Draft 1 → final version<br>Lesson 21'], ['yellow', '3 · AI LEARNING', 'Prompt → AI output → my check → my revision<br>Lessons 22–23']],
        callout: 'BEFORE, I ___.  NOW, I can ___.  The evidence is ___.',
        note: '第 23 课的作业：带 3 件证据。没带：用课件 / 笔记本 / 聊天记录现场找，先问“是什么挡住了你”（不批评，诊断障碍）。' },
      { t: 'frames', id: 'write', title: 'Writing Evidence · My Strongest Revision', prompts: ['DRAFT 1 SAID: ___', 'FINAL SAYS: ___', 'I changed ___ to ___ because ___.'], choice: { id: 'pass', label: 'Which pass?', opts: ['Words', 'Verbs', 'Meaning'] },
        note: '从广告初稿和终稿里选一处最有意义的修改。看他能不能说出理由。老师在汇总里判断：能 / 需要提示 / 不能。' },
      { t: 'aiscale', note: '第 22 课的结论：AI 循环课上没做完。今天他先用证据给自己打分（青色），老师再打一个分（黄色），看差距。' },
    ] },
  { name: 'Measure', zh: '衡量', em: '📏', c1: '#5bb381', c2: '#2f855a', min: '35–43′',
    info: 'Your Desired Future Step 4：第 15 课的 SMART goal 达成了吗？独立性量表，第 23 课和今天对比。',
    slides: [
      { t: 'frames', id: 'smart', kick: 'Your Desired Future · Step 4 · Measurement', title: 'My Lesson 15 SMART Goal · Did I Reach It?', choice: { id: 'smartres', label: 'Result', opts: ['Yes', 'Partly', 'Not yet'] },
        prompts: ['MY GOAL WAS (copy from Lesson 15): ___', 'MY EVIDENCE: ___', 'WHAT HELPED: ___', 'WHAT BLOCKED ME: ___'],
        note: '拿出第 15 课写的 SMART goal 原文。三种结果都可以，关键是证据和原因。' },

function wire(s) {
  const el = $('slide');

  });
  el.querySelectorAll('.choice button').forEach(b => b.onclick = () => {

function wirePassage() {

}
let rec = null, recT = null, recStart = 0, lastAudio = null;
async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const secs = Math.round((Date.now() - recStart) / 1000); put('read_secs', secs);
      lastAudio = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'audio/webm' }));
      rec = null; showAudio();
    };
    rec.start(); recStart = Date.now();
    $('recBtn').textContent = '⏹ 停止'; $('aud').innerHTML = '';
    recT = setInterval(() => { const s = Math.round((Date.now() - recStart) / 1000); $('tmr') && ($('tmr').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`); }, 250);
  } catch (e) { alert('无法使用麦克风（权限被拒绝，或浏览器不支持）。请用手机录音。'); }
}
function stopRec() { clearInterval(recT); if (rec && rec.state !== 'inactive') rec.stop(); }
function showAudio() {
  const a = $('aud'), b = $('recBtn'); if (!a || !b) return;
  b.textContent = '⏺ 重新录音';
  a.innerHTML = `<audio controls src="${lastAudio}"></audio><a class="bigbtn ghost" style="text-decoration:none;font-size:.95em" href="${lastAudio}" download="2026-10-24_StudentC_L24_read.webm">下载录音</a>`;
}

function showGap() {
  let best = null;
  for (let i = 0; i < 5; i++) { const me = get(`indep_${i}_me`), t = get(`indep_${i}_t`); if (me && t && (!best || Math.abs(me - t) > best.d)) best = { i, d: Math.abs(me - t) }; }
  const items = ['Started without waiting for teacher', 'Used the help ladder before asking', 'Used AI for a specific job', 'Checked AI instead of copying', 'Could explain my final answer'];
  $('gap').textContent = best && best.d > 0 ? `Biggest gap: “${items[best.i]}” → that is your next step.` : 'Which line has the biggest gap? That is your next step.';
}

  L.push('', '【2 写作修改】', `  初稿：${v('write_0')}`, `  终稿：${v('write_1')}`, `  理由：${v('write_2')}`, `  哪一遍：${v('pass')}`);
  L.push('', '【3 AI 学习者】（1–4）', `  第 22 课 ${v('ai_l22')} · 今天自评 ${v('ai_self')} · 老师 ${v('ai_teacher')}`, `  证据：${v('ai_ev')}`);
  L.push('', '【4 SMART goal】', `  结果：${v('smartres')}`, `  目标：${v('smart_0')}`, `  证据：${v('smart_1')}`, `  帮到：${v('smart_2')}`, `  挡住：${v('smart_3')}`);
  L.push('', '【5 独立性量表】（第 23 课 / 今天自评 / 今天老师）');
  ['不等老师就开始', '先用求助阶梯再问', '让 AI 做一件具体的事', '检查 AI，而不是照抄', '能解释自己的最终答案'].forEach((t, i) => L.push(`  ${t}：${v(`indep_${i}_23`)} / ${v(`indep_${i}_me`)} / ${v(`indep_${i}_t`)}`));
  L.push('', '【Keep / Change / Stop】', `  Keep：${v('kcs_0')}`, `  Change：${v('kcs_1')}`, `  Stop：${v('kcs_2')}`);
  L.push('', '【4 句反思】', ...[0, 1, 2, 3].map(i => `  ${i + 1}. ${v(`refl_${i}`)}`));
  L.push('', '【一周计划】', `  时间：${v('plan_0')}`, `  做什么：${v('plan_1')}`, `  证据：${v('plan_2')}`, `  AI 角色：${v('coach')}`);
  L.push('', `【下一阶段他的排序】${get('rank', []).map((t, i) => `${i + 1}. ${t}`).join('  ') || '—'}`, `  理由：${v('rank_why')}`);
  L.push('', '【Exit】', `  第 15 课：${v('exit_0')}`, `  今天：${v('exit_1')}`, `  证据：${v('exit_2')}`);
  L.push('', '【老师判断】', `  最有力的独立性证据：${v('t_best')}`, `  AI 的作用：${v('t_ai')}`, `  下一阶段重点：${v('t_next')}`);
  return L.join('\n');
}
function fillSummary() { $('sum').textContent = buildSummary(); }

// ---------- nav ----------
function move(d) {
  const n = ROUNDS[cur].slides.length;
  if (idx + d >= n) { if (cur < ROUNDS.length - 1) { cur++; idx = 0; } else return; }
  else if (idx + d < 0) { if (cur > 0) { cur--; idx = ROUNDS[cur].slides.length - 1; } else return; }
  else idx += d;
  render();
}
$('home').onclick = goHub;
$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('fsm').onclick = () => { fs = Math.max(.6, fs - .1); render(); };
$('fsp').onclick = () => { fs = Math.min(1.6, fs + .1); render(); };
$('ntog').onclick = () => { notesOn = !notesOn; $('note').classList.toggle('hide', !notesOn); };
$('toSummary').onclick = () => openDeck(ROUNDS.length - 1, ROUNDS[ROUNDS.length - 1].slides.length - 1);
$('resetAll').onclick = () => { if (confirm('清空这台设备上第 24 课的所有填写和打分？（无法恢复）')) { DB = {}; save(); buildHub(); } };
document.addEventListener('keydown', e => {
  if ($('deck').style.display !== 'flex') return;
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); move(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); move(-1); }
  if (e.key === 'Escape') goHub();
  if (e.key.toLowerCase() === 'n') $('ntog').click();
});
buildHub();
// #r=3&s=2 opens Part 3, slide 2 directly
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.has('r')) openDeck(Math.min(ROUNDS.length, +hp.get('r')) - 1, Math.max(0, (+hp.get('s') || 1) - 1));
</script>
